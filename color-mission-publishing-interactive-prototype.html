  const mediaQuery = globalThis.matchMedia("(prefers-color-scheme: dark)");
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    "codex-visualization-widget-state",
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? "{}");
  initialStateElement?.remove();
  /** @type {Record<string, unknown> | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? "none";
  let nextStateRequestId = 0;
  /** @type {Map<number, { resolve: () => void; reject: (error: Error) => void; timeout: ReturnType<typeof globalThis.setTimeout>; serializedState: string }>} */
  const pendingStateWrites = new Map();
  const persistenceError = () =>
    Object.assign(
      new Error("The host could not persist the widget state update"),
      {
        code: -32000,
        data: { code: "widget_state_persistence_failed", retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) => {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, "data");
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, "ports");
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, "source");
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) => {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record<string, unknown> | ((previous: Record<string, unknown> | null) => Record<string, unknown>)} next
   * @returns {Promise<void>}
   */
  const setWidgetState = async (next) => {
    const nextState = typeof next === "function" ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) => {
        if (
          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||
          (typeof value === "number" && !Number.isFinite(value))
        ) {
          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    if (
      hasOwn(storedState, "imageIds") &&
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) => typeof id !== "string",
        ))
    ) {
      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length > 0) {
      throw Object.assign(
        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === "none") {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) => {
      const timeout = globalThis.setTimeout(() => {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost("widget-state-write", { id, state: serializedState });
    });
  };
  const syncTheme = () => {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () => {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) => {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) => {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" && data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &&
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) => {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
</script>

<div class="viz-controls"><label class="form-label">Simulated sensor color<select class="form-select" data-input="sample"><option value="blue">Blue</option><option value="green">Green</option><option value="yellow">Yellow</option><option value="purple">Purple</option><option value="orange">Orange</option><option value="scarlet">Scarlet</option><option value="rose">Rose red</option><option value="crimson">Crimson</option><option value="wine">Burgundy</option><option value="coral">Coral red</option><option value="invalid">No color / Unrecognized</option></select></label></div>

<script>
(()=>{
const root=document.getElementById('color-collection');
const scanner=document.createElement('section');
scanner.className='cc-scanner';scanner.setAttribute('aria-label','Color scanning controls');
const device=root.querySelector('.cc-device');
scanner.append(root.querySelector('.cc-mode'),root.querySelector('.cc-camera'),root.querySelector('[data-input="sample"]').closest('.viz-controls'),root.querySelector('.cc-keys'));
root.insertBefore(scanner,device);
const colors={blue:{name:'Blue',hex:'#7db6e5',family:'blue'},green:{name:'Green',hex:'#76ba86',family:'green'},yellow:{name:'Yellow',hex:'#e4cd70',family:'yellow'},purple:{name:'Purple',hex:'#b392dd',family:'purple'},orange:{name:'Orange',hex:'#e9aa70',family:'orange'},scarlet:{name:'Scarlet',hex:'#e8513d',family:'red'},rose:{name:'Rose red',hex:'#cf4972',family:'red'},crimson:{name:'Crimson',hex:'#b7253e',family:'red'},wine:{name:'Burgundy',hex:'#7f2941',family:'red'},coral:{name:'Coral red',hex:'#ee817a',family:'red'}};
const tasks=[{title:'Collect 5 different colors',level:'Easy',mode:'families'},{title:'Collect 5 warm colors',level:'Intermediate',mode:'warm'},{title:'Collect 5 shades of red',level:'Hard',mode:'red'}];
let state={version:3,active:0,page:'mission',sample:'blue',pending:null,collections:[[],[],[]],completed:[],message:'Mission ready. Scan a color, then confirm to collect.'};
const field=k=>root.querySelector('[data-field="'+k+'"]');
const unlocked=()=>Math.min(3,state.completed.length+1);
const collected=()=>state.collections[state.active];
function qualifies(key,i=state.active){return colors[key]&&(tasks[i].mode==='families'||(tasks[i].mode==='warm'?['red','orange','yellow'].includes(colors[key].family):colors[key].family==='red'));}
function duplicate(key){return collected().some(k=>tasks[state.active].mode==='families'?colors[k].family===colors[key].family:k===key);}
function highlightRed(element){
const text=element.textContent;const parts=text.split(/(Rose red|red)/g);
element.replaceChildren(...parts.map(part=>{if(part==='Rose red'||part==='red'){const span=document.createElement('span');span.className='cc-rose';span.textContent=part;return span;}return document.createTextNode(part);}));
}
function render(){
const list=collected(),done=state.completed.includes(state.active);
root.querySelector('[data-page="mission"]').hidden=state.page!=='mission';root.querySelector('[data-page="tasks"]').hidden=state.page!=='tasks';
field('level').textContent=tasks[state.active].level+' · TASK '+(state.active+1)+'/3 · Unlock one balance setting';field('title').textContent=tasks[state.active].title;field('count').textContent=list.length+' / 5';root.querySelector('.cc-track').setAttribute('aria-valuenow',list.length);root.querySelector('.cc-track>div').style.width=list.length*20+'%';
field('slots').replaceChildren(...Array.from({length:5},(_,i)=>{const el=document.createElement('span');el.className='cc-slot';el.textContent=list[i]?colors[list[i]].name:'—';if(list[i]){el.style.background=colors[list[i]].hex;el.style.color=['crimson','wine','rose'].includes(list[i])?'#ffffff':'#17242c';}return el;}));
field('sample').textContent=state.pending?'Detected: '+colors[state.pending].name+' · Awaiting confirmation':done?'Mission complete':'Ready to scan';
field('positions').textContent='Unlocked '+(1+state.completed.length)+' settings';field('unlocked').textContent=unlocked()+' / 3';field('completed').textContent=state.completed.length+' / 3';field('message').textContent=state.message;field('back').textContent=state.page==='tasks'?'Back':'Missions';
root.querySelector('[data-action="scan"]').disabled=done||state.page==='tasks';root.querySelector('[data-action="confirm"]').disabled=!state.pending||state.page==='tasks';
field('tasks').replaceChildren(...tasks.map((task,i)=>{const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.dataset.task=i;b.disabled=i>=unlocked();b.setAttribute('aria-pressed',String(i===state.active));b.textContent=task.title;const small=document.createElement('small');small.textContent=task.level+' · '+(state.completed.includes(i)?'Completed':i<unlocked()?'Ready · '+state.collections[i].length+'/5':'Complete the previous mission to unlock');b.append(small);return b;}));
root.querySelector('[data-input="sample"]').value=state.sample;highlightRed(field('title'));highlightRed(field('sample'));field('message').dataset.confirm=String(Boolean(state.pending)||done);
}
function save(){window.openai?.setWidgetState({modelContent:{currentTask:tasks[state.active].title,collected:collected().map(k=>colors[k].name),unlockedTasks:unlocked(),completedTasks:state.completed.length,unlockedBalanceDetents:1+state.completed.length,simulation:true,scanMode:mode},privateContent:state})?.catch(()=>{});}
function restore(snapshot){const s=snapshot?.privateContent;if(s?.version!==3)return;state.collections=tasks.map((_,i)=>{const a=[];for(const k of (Array.isArray(s.collections?.[i])?s.collections[i]:[])){if(!qualifies(k,i)||a.includes(k)||i===0&&a.some(c=>colors[c].family===colors[k].family))continue;a.push(k);if(a.length===5)break;}return a;});state.completed=[];for(let i=0;i<3&&state.collections[i].length===5;i++)state.completed.push(i);state.active=Number.isInteger(s.active)&&s.active>=0&&s.active<unlocked()?s.active:0;state.sample=colors[s.sample]||s.sample==='invalid'?s.sample:'blue';state.page=s.page==='tasks'?'tasks':'mission';state.pending=qualifies(s.pending)&&!duplicate(s.pending)&&collected().length<5?s.pending:null;state.message=typeof s.message==='string'?s.message:'Collection progress restored.';render();}

let mode='manual',stream=null,cameraStarting=false,captureReady=false,cameraEpoch=0;
const cameraPanel=root.querySelector('.cc-camera'),video=cameraPanel.querySelector('video'),cameraStatus=cameraPanel.querySelector('.cc-camera-status');
const manualPanel=root.querySelector('[data-input="sample"]').closest('.viz-controls');
let lastCameraRGB=null,calibration={};
const calibrationKey='color-quest-camera-calibration-v1';
try{const saved=JSON.parse(localStorage.getItem(calibrationKey)||'{}');for(const key of Object.keys(colors)){if(Array.isArray(saved[key]))calibration[key]=saved[key].filter(rgb=>Array.isArray(rgb)&&rgb.length===3&&rgb.every(v=>Number.isFinite(v)&&v>=0&&v<=255)).slice(-5);}}catch{}
const calibrationPanel=document.createElement('details');
calibrationPanel.innerHTML='<summary class="cursor-interaction">Detection inaccurate? Calibrate colors</summary><p class="text-small">Fill the center box with the object, select its actual color, then click Save color sample. You can save up to 5 samples per color.</p><label class="form-label">Actual object color<select class="form-select" data-calibration="color"></select></label><div class="viz-controls"><button class="btn" type="button" data-calibration="save">Save color sample</button><button class="btn" type="button" data-calibration="reset">Clear calibration</button></div><div class="text-small" data-calibration="status" aria-live="polite"></div>';
calibrationPanel.style.cssText='margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:10px';
cameraPanel.append(calibrationPanel);
const calibrationSelect=calibrationPanel.querySelector('select'),calibrationStatus=calibrationPanel.querySelector('[data-calibration="status"]');
for(const [key,color] of Object.entries(colors)){const option=document.createElement('option');option.value=key;option.textContent=color.name;calibrationSelect.append(option);}
function showCalibration(){const entries=Object.entries(calibration).filter(([,samples])=>samples.length);calibrationStatus.textContent=entries.length?'Calibrated: '+entries.map(([key,samples])=>colors[key].name+' '+samples.length+' samples').join(', '):'No calibration yet. Samples are saved in this browser.';}
function persistCalibration(){try{localStorage.setItem(calibrationKey,JSON.stringify(calibration));showCalibration();}catch{showCalibration();calibrationStatus.textContent+=' (Storage unavailable. Recalibrate after closing this page.)';}}
showCalibration();
function stopCamera(){cameraEpoch++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;cameraPanel.querySelector('[data-camera="stop"]').disabled=true;cameraStatus.textContent='Camera stopped';}
async function startCamera(){
 if(cameraStarting||stream)return;
 if(!navigator.mediaDevices?.getUserMedia){cameraStatus.textContent='Camera access is unavailable. Use an up-to-date Edge or Chrome browser and open this page via localhost or HTTPS.';return;}
 const epoch=++cameraEpoch;cameraStarting=true;cameraStatus.textContent='Waiting for camera permission…';
 try{const acquired=await navigator.mediaDevices.getUserMedia({audio:false,video:{width:{ideal:640},height:{ideal:480}}});

        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>

<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
